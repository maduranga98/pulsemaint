name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - run: npm ci && npm run build
      - name: Clean up stale preview channels
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          STALE_CHANNELS=$(npx firebase-tools@latest hosting:channel:list --project "$VITE_FIREBASE_PROJECT_ID" --json \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const channels = (data.result && data.result.channels) || [];
              const preview = channels
                .filter((c) => !c.name.endsWith('/channels/live'))
                .sort((a, b) => new Date(a.updateTime) - new Date(b.updateTime));
              const KEEP = 15;
              preview.slice(0, Math.max(0, preview.length - KEEP))
                .forEach((c) => console.log(c.name.split('/').pop()));
            ")
          for CHANNEL_ID in $STALE_CHANNELS; do
            echo "Deleting stale preview channel: $CHANNEL_ID"
            npx firebase-tools@latest hosting:channel:delete "$CHANNEL_ID" --project "$VITE_FIREBASE_PROJECT_ID" --force || true
          done
          rm -f "$RUNNER_TEMP/firebase-sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
          projectId: ${{ env.VITE_FIREBASE_PROJECT_ID }}

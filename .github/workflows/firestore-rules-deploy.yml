name: Deploy Firestore/Storage Rules on merge

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch: {}

jobs:
  deploy_firestore_rules:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore/Storage rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,storage --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

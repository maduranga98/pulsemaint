name: Security rules tests

# Runs the Firestore/Storage rules tests against the Firebase emulators whenever
# the rules (or the tests) change, so a rules change that breaks tenant
# isolation, or a flow the app depends on, fails the pull request.
on:
  pull_request:
    paths:
      - firestore.rules
      - storage.rules
      - rules-tests/**
      - .github/workflows/rules-tests.yml
  workflow_dispatch: {}

jobs:
  rules_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npm test

name: Deploy Firebase Functions on merge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      # firebase-tools' own Secret Manager client doesn't reliably pick up
      # an arbitrary GOOGLE_APPLICATION_CREDENTIALS file path — confirmed by
      # `gcloud secrets versions access` succeeding with that exact file
      # while the very next firebase-tools deploy step 403s on the same
      # secret with the same credentials. Setting up ADC the standard way
      # (via this action, which also seeds gcloud's well-known ADC file)
      # makes every credential-discovery path — gcloud's and firebase-tools'
      # internal google-auth-library client alike — find the same identity.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy functions
        run: |
          gcloud config set project "$VITE_FIREBASE_PROJECT_ID"
          # Functions deploy fails outright if the project's Firestore
          # "(default)" database doesn't exist yet (e.g. a freshly created
          # Firebase project). Provision it first; a no-op if it's already
          # there. Requires the deploy service account to hold
          # Service Usage Admin (to enable cloudbilling.googleapis.com
          # and friends), plus Service Account User on the default compute
          # service account (Cloud Functions v2 acts-as it per revision).
          # Pinned to 14.19.1 (not @latest / 15.x) as an experiment: every
          # attempt so far — manual GOOGLE_APPLICATION_CREDENTIALS file,
          # rotated key, secret-level and project-level Secret Manager
          # Secret Accessor grants (all verified live via `gcloud secrets
          # get-iam-policy`), and google-github-actions/auth's standard ADC
          # setup — has failed identically on secretmanager.secrets.get for
          # SMTP_PASSWORD from firebase-tools while `gcloud` itself, with
          # the exact same credentials, reads the secret fine. That isolates
          # the fault to firebase-tools' own secret-validation code, not our
          # environment; pinning an older release checks for a 15.x regression.
          npx firebase-tools@14.19.1 firestore:databases:create "(default)" \
            --location=nam5 \
            --project "$VITE_FIREBASE_PROJECT_ID" \
            --non-interactive || true
          # --force: a function (pushToGoogleSheets) was removed from source
          # in #298 but never deleted from the deployed project, and
          # --non-interactive alone refuses to delete orphaned functions
          # without confirmation — silently failing every deploy since then.
          npx firebase-tools@14.19.1 deploy --only functions --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive --force

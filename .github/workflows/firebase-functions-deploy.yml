name: Deploy Firebase Functions on merge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # Functions deploy fails outright if the project's Firestore
          # "(default)" database doesn't exist yet (e.g. a freshly created
          # Firebase project). Provision it first; a no-op if it's already
          # there. Requires the deploy service account to hold
          # Service Usage Admin (to enable cloudbilling.googleapis.com
          # and friends), plus Service Account User on the default compute
          # service account (Cloud Functions v2 acts-as it per revision).
          npx firebase-tools@latest firestore:databases:create "(default)" \
            --location=nam5 \
            --project "$VITE_FIREBASE_PROJECT_ID" \
            --non-interactive || true
          npx firebase-tools@latest deploy --only functions --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"

name: Deploy Firebase Functions on merge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Write Stripe price ID config
        working-directory: functions
        env:
          STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.STRIPE_PRICE_STARTER_YEARLY }}
          STRIPE_PRICE_WORKSHOP_MONTHLY: ${{ secrets.STRIPE_PRICE_WORKSHOP_MONTHLY }}
          STRIPE_PRICE_WORKSHOP_YEARLY: ${{ secrets.STRIPE_PRICE_WORKSHOP_YEARLY }}
          STRIPE_PRICE_FACTORY_MONTHLY: ${{ secrets.STRIPE_PRICE_FACTORY_MONTHLY }}
          STRIPE_PRICE_FACTORY_YEARLY: ${{ secrets.STRIPE_PRICE_FACTORY_YEARLY }}
        run: |
          cat > .env <<EOF
          STRIPE_PRICE_STARTER_MONTHLY=$STRIPE_PRICE_STARTER_MONTHLY
          STRIPE_PRICE_STARTER_YEARLY=$STRIPE_PRICE_STARTER_YEARLY
          STRIPE_PRICE_WORKSHOP_MONTHLY=$STRIPE_PRICE_WORKSHOP_MONTHLY
          STRIPE_PRICE_WORKSHOP_YEARLY=$STRIPE_PRICE_WORKSHOP_YEARLY
          STRIPE_PRICE_FACTORY_MONTHLY=$STRIPE_PRICE_FACTORY_MONTHLY
          STRIPE_PRICE_FACTORY_YEARLY=$STRIPE_PRICE_FACTORY_YEARLY
          EOF
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSEMAINT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # Push the two real secrets (API key + webhook signing secret) into
          # Firebase Secret Manager from the GitHub Actions secrets of the
          # same name, so `defineSecret` in functions/src/billing/stripeClient.js
          # resolves them at deploy time. No-ops harmlessly if either is unset
          # (first deploy before Stripe is configured).
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            printf '%s' "$STRIPE_SECRET_KEY" | npx firebase-tools@latest functions:secrets:set STRIPE_SECRET_KEY --project "$VITE_FIREBASE_PROJECT_ID" --data-file -
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx firebase-tools@latest functions:secrets:set STRIPE_WEBHOOK_SECRET --project "$VITE_FIREBASE_PROJECT_ID" --data-file -
          fi
          # Functions deploy fails outright if the project's Firestore
          # "(default)" database doesn't exist yet (e.g. a freshly created
          # Firebase project). Provision it first; a no-op if it's already
          # there. Requires the deploy service account to hold
          # Service Usage Admin (to enable cloudbilling.googleapis.com
          # and friends), plus Service Account User on the default compute
          # service account (Cloud Functions v2 acts-as it per revision).
          npx firebase-tools@latest firestore:databases:create "(default)" \
            --location=nam5 \
            --project "$VITE_FIREBASE_PROJECT_ID" \
            --non-interactive || true
          # --force: a function (pushToGoogleSheets) was removed from source
          # in #298 but never deleted from the deployed project, and
          # --non-interactive alone refuses to delete orphaned functions
          # without confirmation — silently failing every deploy since then.
          npx firebase-tools@latest deploy --only functions --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive --force
          rm -f "$RUNNER_TEMP/firebase-sa.json"

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FirmiCore">
  <title>FirmiCore</title>
  <defs>
    <linearGradient id="fc-bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A78F2"/>
      <stop offset="1" stop-color="#1443A8"/>
    </linearGradient>
    <radialGradient id="fc-core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6EC2FF"/>
      <stop offset="0.55" stop-color="#1E6BE6"/>
      <stop offset="1" stop-color="#0A2E8C"/>
    </radialGradient>
    <filter id="fc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded-square backplate -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#20242B"/>

  <!-- Four corner brackets framing the core -->
  <g fill="url(#fc-bracket)" stroke="#37B6F5" stroke-width="4">
    <!-- top-left -->
    <rect x="64"  y="64"  width="176" height="58"  rx="26"/>
    <rect x="64"  y="64"  width="58"  height="176" rx="26"/>
    <!-- top-right -->
    <rect x="272" y="64"  width="176" height="58"  rx="26"/>
    <rect x="390" y="64"  width="58"  height="176" rx="26"/>
    <!-- bottom-left -->
    <rect x="64"  y="390" width="176" height="58"  rx="26"/>
    <rect x="64"  y="272" width="58"  height="176" rx="26"/>
    <!-- bottom-right -->
    <rect x="272" y="390" width="176" height="58"  rx="26"/>
    <rect x="390" y="272" width="58"  height="176" rx="26"/>
  </g>

  <!-- Glowing core sphere -->
  <circle cx="256" cy="256" r="100" fill="#0A2E8C" opacity="0.55" filter="url(#fc-glow)"/>
  <circle cx="256" cy="256" r="96" fill="url(#fc-core)" stroke="#37B6F5" stroke-width="4"/>
</svg>

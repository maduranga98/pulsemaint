<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FirmiCore">
  <title>FirmiCore</title>
  <defs>
    <radialGradient id="fc-plate" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#2468D8"/>
      <stop offset="0.55" stop-color="#1C52C2"/>
      <stop offset="1" stop-color="#163CA6"/>
    </radialGradient>
    <radialGradient id="fc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#3FB4FF" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#2F8FF0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2468D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fc-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#45B6FD"/>
      <stop offset="0.5" stop-color="#2580EA"/>
      <stop offset="1" stop-color="#154CC4"/>
    </radialGradient>
    <clipPath id="fc-clip"><rect x="22" y="22" width="468" height="468" rx="70"/></clipPath>
    <!-- One corner bracket (top-left); the other three are mirrored copies. -->
    <g id="fc-bracket">
      <path d="M219 95.5H121A25.5 25.5 0 0 0 95.5 121V220" stroke="#121620" stroke-width="27"/>
      <rect x="190" y="107" width="29" height="10" fill="#121620"/>
      <rect x="107" y="191" width="10" height="29" fill="#121620"/>
    </g>
  </defs>

  <!-- Dark rounded-square frame with the blue plate inside -->
  <rect x="8" y="8" width="496" height="496" rx="84" fill="#121620"/>
  <rect x="22" y="22" width="468" height="468" rx="70" fill="url(#fc-plate)"/>

  <g clip-path="url(#fc-clip)">
    <!-- Cross bars -->
    <rect x="239" y="8" width="34" height="496" fill="#121620"/>
    <rect x="8" y="239" width="496" height="34" fill="#121620"/>

    <!-- Four corner brackets framing the core -->
    <use href="#fc-bracket"/>
    <use href="#fc-bracket" transform="translate(512 0) scale(-1 1)"/>
    <use href="#fc-bracket" transform="translate(0 512) scale(1 -1)"/>
    <use href="#fc-bracket" transform="translate(512 512) scale(-1 -1)"/>

    <!-- Glow around the core -->
    <circle cx="256" cy="256" r="172" fill="url(#fc-glow)"/>
  </g>

  <!-- Core sphere in its dark ring -->
  <circle cx="256" cy="256" r="127" fill="#121620"/>
  <circle cx="256" cy="256" r="111" fill="url(#fc-core)"/>
</svg>
